<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearwave Landing Page</title>
    <!-- Importing Playfair Display for headings and Inter for body text -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7faf9; /* Soft, off-white background */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* --- Main Container --- */
        .hero-section {
            text-align: center;
            max-width: 1200px;
            width: 100%;
        }

        /* --- Typography --- */
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: #2d6a4f; /* Dark green theme color */
            text-transform: uppercase;
            margin-bottom: 20px;
            position: relative;
        }

        /* Adding the small bullet dot before the badge text */
        .badge::before {
            content: '•';
            margin-right: 6px;
            font-size: 14px;
            vertical-align: middle;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: #111111;
            line-height: 1.2;
            margin-bottom: 24px;
        }

        h1 span {
            font-style: italic;
            font-weight: 700;
        }

        .description {
            font-size: 15px;
            color: #666666;
            max-width: 540px;
            margin: 0 auto 60px auto;
            line-height: 1.6;
        }

        /* --- Mockup Gallery Layout --- */
        .mockup-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-top: 20px;
            padding: 0 40px;
        }

        /* Base mockup image styling */
        .mockup-container img {
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            background-color: #ffffff;
            transition: transform 0.3s ease;
        }

        /* Perspective Scaling (Center card stands out higher) */
        .side-left-far {
            width: 140px;
            transform: translateY(40px) scale(0.85);
        }

        .side-left {
            width: 180px;
            transform: translateY(20px) scale(0.92);
        }

        .center-main {
            width: 230px;
            z-index: 2;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1) !important;
        }

        .side-right {
            width: 180px;
            transform: translateY(20px) scale(0.92);
        }

        .side-right-far {
            width: 140px;
            transform: translateY(40px) scale(0.85);
        }

        /* Subtle hover effect */
        .mockup-container img:hover {
            transform: translateY(-5px) scale(1);
            z-index: 3;
        }

        /* --- Responsive Viewports --- */
        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }
            
            .mockup-container {
                flex-wrap: wrap;
                gap: 15px;
                padding: 0;
            }

            .mockup-container img {
                width: 45% !important;
                transform: none !important;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <!-- Top Metadata Category -->
        <span class="badge">Mobile App</span>
        
        <!-- Main Pitch Heading -->
        <h1>Your workspace,<br><span>in your pocket</span></h1>
        
        <!-- Supporting Subtext -->
        <p class="description">
            The Clearwave mobile app brings every dashboard, task, and notification to you — beautifully adapted for any screen.
        </p>
        
        <!-- UI Display Showcase Stack -->
        <div class="mockup-container">
            <!-- Replace placeholder URLs with your project screenshot slices -->
            <img src="images/tm-622-screen-02.jpg"alt="Far Left Panel" class="side-left-far">
            <img src="images/tm-622-screen-03.jpg" alt="Left App Screen" class="side-left">
            <img src="images/tm-622-screen-04.jpg"alt=" Main Screen" class="center-main">
            <img src="images/tm-622-screen-05.jpg" alt="Right App Screen" class="side-right">
            <img src="images/tm-622-screen-01.jpg" alt="Far Right Panel" class="side-right-far">
        </div>
    </section>
    
    

</body>
</html>
